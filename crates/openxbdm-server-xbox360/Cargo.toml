[package]
name = "openxbdm-server-xbox360"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Xbox 360 system debugger module"
publish = false

[[bin]]
name = "openxbdm-server-xbox360"
path = "src/main.rs"

[features]
default = ["smb"]
# SMB file server on TCP port 445.
smb = ["openxbdm-server/smb"]
# Deployment through DEVKIT:\FlashEx: a boot without the marker file
# DEVKIT:\FlashEx\openxbdm.arm removes the override module and restarts.
boot-guard = []
# Retail loading as a dashlaunch plugin (docs/re-notes/retail-dashlaunch.md):
# `ExDebugMonitorService` registration is unavailable, so the exception hook
# goes through dashlaunch's `ldata` (`DebugRoutine`/`DebugStepPatch`)
# instead, and startup skips the devkit-only FlashEx override handling.
dashlaunch = []
# File-backed startup trace (src/trace.rs), for diagnosing module startup
# on hardware with no kernel debugger attached. Not for production builds.
trace-log = []

[dependencies]
openxbdm-core = { path = "../openxbdm-core" }
openxbdm-server = { path = "../openxbdm-server", default-features = false }

# The module targets powerpc-unknown-xbox360, which Buck2 builds
# (build_defs/update_buck_files.py, xbox360/BUCK); for the host, Cargo
# builds a stub.
[package.metadata.buck2.xbox360]
link_script = "link.x"
